<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">Figure 1: Decision Accuracy Across Controlled Evidence Conditions</text>
  <text x="400" y="55" font-size="12" fill="#7f8c8d" text-anchor="middle">Comparison of Frozen Base (Qwen2.5-1.5B) vs. QLoRA-Adapted Reader (95% Bootstrap CI)</text>
  
  <!-- Grid Lines -->
  <line x1="80" y1="400" x2="750" y2="400" stroke="#bdc3c7" stroke-width="1"/>
  <line x1="80" y1="325" x2="750" y2="325" stroke="#ecf0f1" stroke-width="1" stroke-dasharray="4"/>
  <line x1="80" y1="250" x2="750" y2="250" stroke="#ecf0f1" stroke-width="1" stroke-dasharray="4"/>
  <line x1="80" y1="175" x2="750" y2="175" stroke="#ecf0f1" stroke-width="1" stroke-dasharray="4"/>
  <line x1="80" y1="100" x2="750" y2="100" stroke="#ecf0f1" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Y-Axis Labels -->
  <text x="70" y="405" font-size="11" text-anchor="end" fill="#7f8c8d">0.0</text>
  <text x="70" y="330" font-size="11" text-anchor="end" fill="#7f8c8d">0.25</text>
  <text x="70" y="255" font-size="11" text-anchor="end" fill="#7f8c8d">0.50</text>
  <text x="70" y="180" font-size="11" text-anchor="end" fill="#7f8c8d">0.75</text>
  <text x="70" y="105" font-size="11" text-anchor="end" fill="#7f8c8d">1.00</text>
  <text x="25" y="250" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50" transform="rotate(-90 25 250)">Decision Accuracy (DA)</text>
  
  <!-- Reference Lines for E1 & E2 -->
  <line x1="80" y1="188.5" x2="750" y2="188.5" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="6"/>
  <text x="745" y="183" font-size="10" font-weight="bold" fill="#2980b9" text-anchor="end">E1 Base Q-Only (0.705)</text>
  
  <line x1="80" y1="187" x2="750" y2="187" stroke="#d35400" stroke-width="1.5" stroke-dasharray="2"/>
  <text x="745" y="199" font-size="10" font-weight="bold" fill="#d35400" text-anchor="end">E2 QLoRA Q-Only (0.710)</text>

  <!-- Bars C1 (Good) Base: 0.82 (y=154, h=246), QLoRA: 0.90 (y=130, h=270) -->
  <rect x="130" y="154" width="45" height="246" fill="#4a90e2" rx="3"/>
  <text x="152" y="145" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">82.0%</text>
  <rect x="180" y="130" width="45" height="270" fill="#e67e22" rx="3"/>
  <text x="202" y="120" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">90.0%</text>
  <text x="177" y="425" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">C1: Good</text>
  
  <!-- Bars C2 (Incomplete) Base: 0.59 (y=223, h=177), QLoRA: 0.435 (y=269.5, h=130.5) -->
  <rect x="280" y="223" width="45" height="177" fill="#4a90e2" rx="3"/>
  <text x="302" y="214" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">59.0%</text>
  <rect x="330" y="269.5" width="45" height="130.5" fill="#e67e22" rx="3"/>
  <text x="352" y="260" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">43.5%</text>
  <text x="327" y="425" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">C2: Incomplete</text>

  <!-- Bars C3 (Irrelevant) Base: 0.785 (y=164.5, h=235.5), QLoRA: 0.75 (y=175, h=225) -->
  <rect x="430" y="164.5" width="45" height="235.5" fill="#4a90e2" rx="3"/>
  <text x="452" y="155" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">78.5%</text>
  <rect x="480" y="175" width="45" height="225" fill="#e67e22" rx="3"/>
  <text x="502" y="166" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">75.0%</text>
  <text x="477" y="425" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">C3: Irrelevant</text>

  <!-- Bars C4 (Misleading) Base: 0.385 (y=284.5, h=115.5), QLoRA: 0.365 (y=290.5, h=109.5) -->
  <rect x="580" y="284.5" width="45" height="115.5" fill="#4a90e2" rx="3"/>
  <text x="602" y="275" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">38.5%</text>
  <rect x="630" y="290.5" width="45" height="109.5" fill="#e67e22" rx="3"/>
  <text x="652" y="281" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">36.5%</text>
  <text x="627" y="425" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">C4: Misleading</text>

  <!-- Legend -->
  <rect x="270" y="455" width="15" height="15" fill="#4a90e2" rx="2"/>
  <text x="295" y="467" font-size="12" fill="#2c3e50">Frozen Base Reader (Qwen2.5-1.5B)</text>
  <rect x="500" y="455" width="15" height="15" fill="#e67e22" rx="2"/>
  <text x="525" y="467" font-size="12" fill="#2c3e50">QLoRA-Adapted Reader</text>
</svg>