<svg width="800" height="420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="30" font-size="17" font-weight="bold" text-anchor="middle" fill="#2c3e50">Figure 2: Robustness Trade-Offs (Abstention vs. Adversarial Adoption)</text>
  
  <!-- Panel 1: CAR under C2 -->
  <g transform="translate(50, 60)">
    <rect width="320" height="300" fill="#f8f9fa" rx="5" stroke="#e2e8f0"/>
    <text x="160" y="25" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">Panel A: Incomplete Evidence (C2)</text>
    <text x="160" y="42" font-size="11" text-anchor="middle" fill="#7f8c8d">Correct Abstention Rate (CAR)</text>
    
    <line x1="50" y1="250" x2="280" y2="250" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="50" y1="150" x2="280" y2="150" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3"/>
    <line x1="50" y1="50" x2="280" y2="50" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3"/>
    
    <text x="45" y="255" font-size="10" text-anchor="end" fill="#94a3b8">0%</text>
    <text x="45" y="155" font-size="10" text-anchor="end" fill="#94a3b8">50%</text>
    <text x="45" y="55" font-size="10" text-anchor="end" fill="#94a3b8">100%</text>
    
    <!-- Base CAR: 24.0% (h=48, y=202) -->
    <rect x="80" y="202" width="55" height="48" fill="#4a90e2" rx="3"/>
    <text x="107" y="194" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">24.0%</text>
    <text x="107" y="270" font-size="11" font-weight="bold" text-anchor="middle" fill="#475569">Base</text>
    
    <!-- QLoRA CAR: 45.5% (h=91, y=159) -->
    <rect x="180" y="159" width="55" height="91" fill="#e67e22" rx="3"/>
    <text x="207" y="151" font-size="11" font-weight="bold" text-anchor="middle" fill="#2c3e50">45.5%</text>
    <text x="207" y="270" font-size="11" font-weight="bold" text-anchor="middle" fill="#475569">QLoRA</text>
  </g>

  <!-- Panel 2: UCAR & CBFR under C4 -->
  <g transform="translate(420, 60)">
    <rect width="340" height="300" fill="#f8f9fa" rx="5" stroke="#e2e8f0"/>
    <text x="170" y="25" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">Panel B: Misleading Evidence (C4)</text>
    <text x="170" y="42" font-size="11" text-anchor="middle" fill="#7f8c8d">Counterfactual Adoption Rates</text>
    
    <line x1="50" y1="250" x2="300" y2="250" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="50" y1="150" x2="300" y2="150" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3"/>
    <line x1="50" y1="50" x2="300" y2="50" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3"/>
    
    <text x="45" y="255" font-size="10" text-anchor="end" fill="#94a3b8">0%</text>
    <text x="45" y="155" font-size="10" text-anchor="end" fill="#94a3b8">50%</text>
    <text x="45" y="55" font-size="10" text-anchor="end" fill="#94a3b8">100%</text>
    
    <!-- Base UCAR: 43.4% (h=86.8, y=163.2), CBFR: 61.0% (h=122, y=128) -->
    <rect x="80" y="163.2" width="35" height="86.8" fill="#c0392b" rx="2"/>
    <text x="97" y="155" font-size="10" font-weight="bold" text-anchor="middle" fill="#c0392b">43.4%</text>
    <rect x="120" y="128" width="35" height="122" fill="#8e44ad" rx="2"/>
    <text x="137" y="120" font-size="10" font-weight="bold" text-anchor="middle" fill="#8e44ad">61.0%</text>
    <text x="117" y="270" font-size="11" font-weight="bold" text-anchor="middle" fill="#475569">Base</text>
    
    <!-- QLoRA UCAR: 36.4% (h=72.8, y=177.2), CBFR: 49.6% (h=99.2, y=150.8) -->
    <rect x="200" y="177.2" width="35" height="72.8" fill="#c0392b" rx="2"/>
    <text x="217" y="169" font-size="10" font-weight="bold" text-anchor="middle" fill="#c0392b">36.4%</text>
    <rect x="240" y="150.8" width="35" height="99.2" fill="#8e44ad" rx="2"/>
    <text x="257" y="143" font-size="10" font-weight="bold" text-anchor="middle" fill="#8e44ad">49.6%</text>
    <text x="237" y="270" font-size="11" font-weight="bold" text-anchor="middle" fill="#475569">QLoRA</text>
    
    <!-- Mini legend -->
    <rect x="75" y="285" width="12" height="12" fill="#c0392b" rx="2"/>
    <text x="92" y="295" font-size="10" fill="#2c3e50">UCAR (Unconditional)</text>
    <rect x="195" y="285" width="12" height="12" fill="#8e44ad" rx="2"/>
    <text x="212" y="295" font-size="10" fill="#2c3e50">CBFR (Conditional)</text>
  </g>
</svg>